  <!-- ── GA4 ────────────────────────────────────────────────────────────── -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX', { send_page_view: false });
    // send_page_view: false — le page_view est envoyé manuellement via analytics.js
  </script>
